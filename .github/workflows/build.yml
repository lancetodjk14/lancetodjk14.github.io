name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A6F465: ${{ secrets.A6F465 }}
          BAB9CE: ${{ secrets.BAB9CE }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A6F465', '')
          tag_b = os.environ.get('BAB9CE', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 19e1c7261ab7c77fa7ca26faf22a3174e1099f1f6b52d9c5 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- d36e6d688e5f4a052718eebd338132a266a912cbd3219c -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
